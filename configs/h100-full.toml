# Template for a GPU run over a private, locally prepared LINK dataset.
# The referenced Parquet file is not distributed with this repository.
data_path = "data/link-hourly.parquet"
timestamp_column = "timestamp"
id_column = "item_id"
target_column = "target"
past_covariates = ["eth_price", "gas_gwei", "oracle_deviation"]
prediction_length = 24
quantile_levels = [0.1, 0.5, 0.9]
model_id = "amazon/chronos-2"
device = "cuda"
seed = 42

# Temporal split only. Boundaries must fall inside the prepared dataset's range.
[split]
train_end = "2026-01-01T00:00:00Z"
validation_end = "2026-04-01T00:00:00Z"
test_end = "2026-07-01T00:00:00Z"

[training]
bf16 = true
flash_attention_2 = "auto"
per_device_train_batch_size = 32
gradient_accumulation_steps = 8
max_steps = 1000
learning_rate = 1e-5
